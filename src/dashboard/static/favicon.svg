<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Liquid Glass Prism Gradients -->
    <linearGradient id="favTopGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="favLayer4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="favLayer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="favBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(0, 242, 254, 0.3)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS 27 Continuous Squircle Container (Obsidian Glass) -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#070B14" stroke="url(#favBorder)" stroke-width="1.5" />

  <!-- Quantum Axis Laser Line -->
  <line x1="50" y1="14" x2="50" y2="84" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="2.5,2.5" opacity="0.75" />

  <!-- PHASE 1: Base Layer (Scout Trend Substrate) -->
  <polygon points="50,68 82,78 50,88 18,78" fill="url(#favBase)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
  <circle cx="50" cy="78" r="1.8" fill="#38BDF8" opacity="0.6" />

  <!-- PHASE 2: Layer 2 (Prompt Architect) -->
  <polygon points="50,55 82,65 50,75 18,65" fill="#0C243C" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
  <circle cx="50" cy="65" r="2" fill="#38BDF8" opacity="0.75" />

  <!-- PHASE 3: Layer 3 (ComfyUI Dual Factory) -->
  <polygon points="50,42 82,52 50,62 18,52" fill="url(#favLayer3)" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.4" />
  <circle cx="50" cy="52" r="2.2" fill="#00F2FE" opacity="0.85" />

  <!-- PHASE 4: Layer 4 (Cataloger 300 DPI) -->
  <polygon points="50,29 82,39 50,49 18,39" fill="url(#favLayer4)" stroke="rgba(103, 232, 249, 0.8)" stroke-width="1.5" />
  <circle cx="50" cy="39" r="2.5" fill="#67E8F9" opacity="0.9" />

  <!-- PHASE 5: Layer 5 (Global Multi-Agency Top Prism) -->
  <polygon points="50,16 82,26 50,36 18,26" fill="url(#favTopGlass)" stroke="rgba(255, 255, 255, 0.9)" stroke-width="1.8" />
  
  <!-- Top Glass Highlight Refraction -->
  <polyline points="18,26 50,36 82,26" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />
  <line x1="50" y1="16" x2="50" y2="36" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1" />

  <!-- Quantum Focal Core -->
  <circle cx="50" cy="26" r="6" fill="#00F2FE" opacity="0.35" filter="url(#favGlow)" />
  <circle cx="50" cy="26" r="3.6" fill="#00F2FE" filter="url(#favGlow)" />
  <circle cx="50" cy="26" r="1.6" fill="#FFFFFF" />

  <!-- Specular Corner Glints -->
  <circle cx="82" cy="26" r="1.5" fill="#FFFFFF" />
  <circle cx="18" cy="26" r="1.5" fill="#67E8F9" />
  <circle cx="50" cy="16" r="1.6" fill="#FFFFFF" />
</svg>
