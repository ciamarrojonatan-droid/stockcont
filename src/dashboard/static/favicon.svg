<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.6)" />
      <stop offset="50%" stop-color="rgba(0, 242, 254, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)" />
    </linearGradient>

    <linearGradient id="favFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.5)" />
    </linearGradient>

    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <polygon points="50,6 90,29 90,75 50,98 10,75 10,29" fill="#090E1A" stroke="url(#favBorder)" stroke-width="2.2" />

  <!-- 6 Dynamic Aperture Shutter Blades -->
  <polygon points="50,6 90,29 50,52" fill="url(#favFacet)" stroke="url(#favCyan)" stroke-width="1.4" opacity="0.85" />
  <polygon points="90,29 90,75 55,60" fill="url(#favFacet)" stroke="url(#favCyan)" stroke-width="1.4" opacity="0.75" />
  <polygon points="90,75 50,98 45,60" fill="url(#favFacet)" stroke="url(#favCyan)" stroke-width="1.4" opacity="0.9" />
  <polygon points="50,98 10,75 50,52" fill="url(#favFacet)" stroke="url(#favCyan)" stroke-width="1.4" opacity="0.8" />
  <polygon points="10,75 10,29 42,44" fill="url(#favFacet)" stroke="url(#favCyan)" stroke-width="1.4" opacity="0.7" />
  <polygon points="10,29 50,6 55,44" fill="url(#favFacet)" stroke="url(#favCyan)" stroke-width="1.4" opacity="0.95" />

  <!-- Microstock Core AI Center -->
  <circle cx="50" cy="52" r="7.5" fill="#00F2FE" opacity="0.3" />
  <circle cx="50" cy="52" r="4.5" fill="#00F2FE" filter="url(#favGlow)" />
  <circle cx="50" cy="52" r="2" fill="#FFFFFF" />

  <!-- Glass Specular Highlights -->
  <circle cx="50" cy="6" r="1.8" fill="#FFFFFF" />
  <circle cx="90" cy="29" r="1.6" fill="#00F2FE" />
  <circle cx="10" cy="75" r="1.6" fill="#4FACFE" />
</svg>
