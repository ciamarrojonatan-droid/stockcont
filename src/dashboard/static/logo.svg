<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="100%" height="100%">
  <defs>
    <!-- Cyan to Sky Blue Core Gradient -->
    <linearGradient id="prismCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Top Floating Prism (Liquid Glass Surface) -->
    <linearGradient id="prismTopGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Mid Layer 4 (Cataloger) -->
    <linearGradient id="prismLayer4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.4" />
    </linearGradient>

    <!-- Mid Layer 3 (ComfyUI Factory) -->
    <linearGradient id="prismLayer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.3" />
    </linearGradient>

    <!-- Mid Layer 2 (Prompt Director) -->
    <linearGradient id="prismLayer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#082F49" stop-opacity="0.25" />
    </linearGradient>

    <!-- Base Layer 1 (Scout Core) -->
    <linearGradient id="prismBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1322" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Specular Edge Gradient -->
    <linearGradient id="prismSpecular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.8)" />
      <stop offset="50%" stop-color="rgba(0, 242, 254, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)" />
    </linearGradient>

    <!-- Quantum Core Glow Filter -->
    <filter id="prismGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ── 3D CYBER PRISM STACK (5-PHASE PIPELINE WAFER) ── -->
  <g transform="translate(18, 12)">
    
    <!-- Vertical Quantum Axis Guide / Pipeline Conduit -->
    <line x1="45" y1="2" x2="45" y2="86" stroke="#00F2FE" stroke-width="1.6" stroke-dasharray="2.5,2.5" opacity="0.65" />
    
    <!-- PHASE 1: Base Layer (Scout Trend Substrate) -->
    <!-- Center: (45, 74) | Width: 70 | Height: 24 -->
    <polygon points="45,62 80,74 45,86 10,74" fill="url(#prismBase)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
    <circle cx="45" cy="74" r="1.6" fill="#38BDF8" opacity="0.6" />

    <!-- PHASE 2: Layer 2 (Prompt Architect & Vision Ingestion) -->
    <!-- Center: (45, 60) -->
    <polygon points="45,48 80,60 45,72 10,60" fill="url(#prismLayer2)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <circle cx="45" cy="60" r="1.8" fill="#38BDF8" opacity="0.75" />

    <!-- PHASE 3: Layer 3 (ComfyUI Dual RPA Factory) -->
    <!-- Center: (45, 46) -->
    <polygon points="45,34 80,46 45,58 10,46" fill="url(#prismLayer3)" stroke="rgba(56, 189, 248, 0.55)" stroke-width="1.4" />
    <circle cx="45" cy="46" r="2.2" fill="#00F2FE" opacity="0.85" />

    <!-- PHASE 4: Layer 4 (Binary Cataloger 300 DPI & Mastering) -->
    <!-- Center: (45, 32) -->
    <polygon points="45,20 80,32 45,44 10,32" fill="url(#prismLayer4)" stroke="rgba(103, 232, 249, 0.75)" stroke-width="1.5" />
    <circle cx="45" cy="32" r="2.5" fill="#67E8F9" opacity="0.9" />

    <!-- PHASE 5: Layer 5 (Global Multi-Agency High-Yield Top Prism) -->
    <!-- Center: (45, 18) -->
    <polygon points="45,6 80,18 45,30 10,18" fill="url(#prismTopGlass)" stroke="url(#prismSpecular)" stroke-width="1.8" />
    
    <!-- Top Glass Isometric Facet Reflection Lines -->
    <polyline points="10,18 45,30 80,18" stroke="#FFFFFF" stroke-width="1.2" opacity="0.75" />
    <line x1="45" y1="6" x2="45" y2="30" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1" />

    <!-- Quantum Core Focal Ray Emitter -->
    <circle cx="45" cy="18" r="6" fill="#00F2FE" opacity="0.3" filter="url(#prismGlow)" />
    <circle cx="45" cy="18" r="3.6" fill="#00F2FE" filter="url(#prismGlow)" />
    <circle cx="45" cy="18" r="1.6" fill="#FFFFFF" />

    <!-- Corner Specular Refractions -->
    <circle cx="80" cy="18" r="1.4" fill="#FFFFFF" opacity="0.9" />
    <circle cx="10" cy="18" r="1.4" fill="#67E8F9" opacity="0.9" />
    <circle cx="45" cy="6" r="1.6" fill="#FFFFFF" />
  </g>

  <!-- ── TECHNICAL BRANDMARK TYPOGRAPHY ── -->
  <g transform="translate(126, 56)">
    <!-- Primary Brand Wordmark -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Inter', sans-serif" font-size="35" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
      STOCK<tspan fill="url(#prismCyanGrad)">CONT</tspan>
    </text>

    <!-- Subtitle Engineering Descriptor -->
    <text y="24" font-family="'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600" fill="rgba(255, 255, 255, 0.45)" letter-spacing="0.28em">
      5-STAGE MASS PRODUCTION RIG
    </text>

    <!-- Precision Telemetry Track & Focal Beads -->
    <rect x="0" y="32" width="228" height="1" fill="url(#prismCyanGrad)" opacity="0.25" />
    <circle cx="0" cy="32.5" r="1.5" fill="#38BDF8" opacity="0.8" />
    <circle cx="114" cy="32.5" r="1.5" fill="#00F2FE" opacity="0.9" />
    <circle cx="228" cy="32.5" r="1.8" fill="#00F2FE" filter="url(#prismGlow)" />
  </g>
</svg>
